# External Nginx Configuration for olite.hd.free.fr
# This proxies to Kubernetes cluster at 10.17.1.200:80

server {
    listen 443 ssl http2;
    server_name olite.hd.free.fr;

    # SSL certificates (update paths as needed)
    ssl_certificate /path/to/your/cert.pem;
    ssl_certificate_key /path/to/your/key.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy everything to Kubernetes Ingress
    location / {
        proxy_pass http://10.17.1.200:80;
        proxy_set_header Host myfirstgitapp.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host olite.hd.free.fr;
        proxy_redirect off;
        
        # Preserve large headers for Keycloak OAuth
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name olite.hd.free.fr;
    return 301 https://$server_name$request_uri;
}
