apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: myfirstgitapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/mcharpen5/myfirstapp-frontend:latest
          env:
            - name: NODE_ENV
              value: production
            - name: KEYCLOAK_CLIENT_ID
              value: myapp-client
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: frontend-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: KEYCLOAK_ISSUER
              value: https://myfirstgitapp.local/libertyX/auth/realms/myapp
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: frontend-secrets
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_URL
              value: https://myfirstgitapp.local/libertyX/api/auth
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: myfirstgitapp
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: frontend
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  namespace: myfirstgitapp
type: Opaque
stringData:
  KEYCLOAK_CLIENT_SECRET: your-actual-keycloak-client-secret
  NEXTAUTH_SECRET: your-random-secret
