apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: myfirstgitapp
data:
  create_emp_table.sql: |
    CREATE TABLE IF NOT EXISTS emp (
      id SERIAL PRIMARY KEY,
      first_name VARCHAR(100) NOT NULL,
      last_name VARCHAR(100) NOT NULL,
      birth_date DATE,
      salary NUMERIC(12,2)
    );
