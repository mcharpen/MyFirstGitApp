apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myfirstgitapp
  namespace: myfirstgitapp
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: dev2.sophia.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
