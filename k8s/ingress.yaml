apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myfirstgitapp
  namespace: default  # Changed to default namespace where the working nginx service is
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/upstream-vhost: "olite.hd.free.fr"
spec:
  tls:
    - hosts:
        - olite.hd.free.fr
      secretName: myfirstgitapp-tls
  rules:
    - host: olite.hd.free.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
    - host: myfirstgitapp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80

