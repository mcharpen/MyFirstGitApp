apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myfirstgitapp
  namespace: myfirstgitapp
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-http01
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - olite.hd.free.fr
      secretName: myfirstgitapp-tls
  rules:
    - host: olite.hd.free.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-proxy
                port:
                  number: 80
---
# ExternalName service to reference nginx in default namespace
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy
  namespace: myfirstgitapp
spec:
  type: ExternalName
  externalName: nginx.default.svc.cluster.local
  ports:
    - port: 80
      targetPort: 80

