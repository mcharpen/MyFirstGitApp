apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myfirstgitapp
  namespace: myfirstgitapp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: myfirstgitapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: myfirstgitapp-service
            port:
              number: 80
