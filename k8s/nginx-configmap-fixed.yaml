apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: default
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on; keepalive_timeout 65;
      server {
        listen 80;
        server_name _;
        # Redirect /libertyX to /libertyX/
        location = /libertyX { return 301 /libertyX/; }
        
        # Keycloak proxy at /libertyX/auth (pass full path to Keycloak)
        location /libertyX/auth/ {
          proxy_pass http://keycloak.myfirstgitapp.svc.cluster.local:8080/libertyX/auth/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_buffer_size 128k;
          proxy_buffers 4 256k;
          proxy_busy_buffers_size 256k;
        }
        
        # NextAuth callback - handle /libertyX/callback/* (must be prefix location to match before /libertyX/)
        location /libertyX/callback/ {
          rewrite ^/libertyX/callback/(.*)$ /libertyX/api/auth/callback/$1 break;
          proxy_pass http://frontend.myfirstgitapp.svc.cluster.local:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
        }
        
        # API (NextAuth) under /api → Next.js at /libertyX/api/
        location /api/ {
          proxy_pass http://frontend.myfirstgitapp.svc.cluster.local:3000/libertyX/api/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Backend emp endpoints (supports bare /emp and /libertyX/emp)
        location = /emp { proxy_pass http://backend.myfirstgitapp.svc.cluster.local:8080/emp; }
        location /libertyX/emp { proxy_pass http://backend.myfirstgitapp.svc.cluster.local:8080/emp; }
        # Frontend app at /libertyX/
        location /libertyX/ {
          proxy_pass http://frontend.myfirstgitapp.svc.cluster.local:3000/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Redirect root to /libertyX/
        location = / { return 301 /libertyX/; }
      }
    }
