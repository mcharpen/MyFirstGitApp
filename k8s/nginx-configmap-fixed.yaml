apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: myfirstgitapp
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on; keepalive_timeout 65;
      
      # Map to determine the forwarded protocol
      # Use the X-Forwarded-Proto header if set (from external Nginx), otherwise use $scheme
      map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
      }
      
      server {
        listen 80;
        server_name myfirstgitapp.local olite.hd.free.fr;
        
        # Health check endpoint for readiness probe
        location = /health {
          access_log off;
          return 200 "OK\n";
          add_header Content-Type text/plain;
        }
        
        # Keycloak proxy at /libertyX/auth (pass full path to Keycloak)
        location /libertyX/auth/ {
          proxy_pass http://keycloak.myfirstgitapp.svc.cluster.local:8080/libertyX/auth/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
          proxy_buffer_size 128k;
          proxy_buffers 4 256k;
          proxy_busy_buffers_size 256k;
        }
        
        # API (NextAuth) under /api → Next.js at /api/ (basePath doesn't apply to API routes!)

        # Backend emp endpoints (supports bare /emp and /libertyX/emp)
        location = /emp { 
          proxy_pass http://backend.myfirstgitapp.svc.cluster.local:8080/emp; 
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
        }
        location /libertyX/emp { 
          proxy_pass http://backend.myfirstgitapp.svc.cluster.local:8080/emp; 
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
        }
        # Frontend app at /libertyX/ (strip basePath before proxying to Next.js)
        location /libertyX/ {
          proxy_pass http://frontend.myfirstgitapp.svc.cluster.local:3000/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $forwarded_proto;
          proxy_set_header X-Forwarded-Host $host;
        }
        # Redirect root to /libertyX/
        location = / { return 301 /libertyX/; }
      }
    }
