- hosts: all
  become: yes
  tasks:
    - name: Update system
      dnf:
        name: "*"
        state: latest

    - name: Disable swap
      command: swapoff -a
      args:
        warn: false

    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '(^.*swap.*$)'
        replace: '# \1'

    - name: Enable kernel modules
      shell: |
        modprobe overlay
        modprobe br_netfilter

    - name: Set sysctl params
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.ipv4.ip_forward                 = 1
          net.bridge.bridge-nf-call-ip6tables = 1
      notify: Reload sysctl

    - name: Install Docker
      dnf:
        name: docker-engine
        state: present

    - name: Enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Install Kubernetes packages
      dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Enable kubelet
      systemd:
        name: kubelet
        enabled: yes

  handlers:
    - name: Reload sysctl
      command: sysctl --system

