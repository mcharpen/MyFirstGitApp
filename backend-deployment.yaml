apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgres:5432/youtube_summary_db
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: mypgpassword
            - name: QUARKUS_DATASOURCE_USERNAME
              value: mcharpen
            - name: QUARKUS_HTTP_PORT
              value: "8080"
          image: backend
          name: myfirstgitapp-backend
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
