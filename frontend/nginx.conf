user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Enhanced logging format to see forwarded headers
    log_format debug '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host=$host x_fwd_host=$http_x_forwarded_host x_fwd_proto=$http_x_forwarded_proto '
                    'forwarded_host=$forwarded_host forwarded_proto=$forwarded_proto';

    access_log /var/log/nginx/access.log debug;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Use forwarded headers from Ingress if available, otherwise fall back to current request
    # For external access, always use the public URL to avoid NAT hairpinning issues
    map $http_x_forwarded_host $forwarded_host {
        default "olite.hd.free.fr";
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default "https";
    }

    server {
        listen 80;
        server_name dev2.sophia.com;

        # Proxy /libertyX/api/* to Next.js at /api/* (basePath doesn't apply to API routes)
        location /libertyX/api/ {
            proxy_pass http://frontend.myfirstgitapp.svc.cluster.local:3000/api/;
            # Use the mapped variables that fall back to current request if forwarded headers are empty
            proxy_set_header Host $forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        location = /emp {
            proxy_pass http://backend.myfirstgitapp.svc.cluster.local:8080/emp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /libertyX/emp {
            proxy_pass http://backend.myfirstgitapp.svc.cluster.local:8080/emp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /libertyX/ {
            proxy_pass http://frontend.myfirstgitapp.svc.cluster.local:3000/;
            proxy_set_header Host $forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
        }

        # Health check endpoint for readiness probe
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        location = / { return 301 /libertyX/; }
    }
}

