user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name dev2.sophia.com; # was localhost, set to the intended host

        # Backend API under /libertyX/emp -> upstream /emp
        location /libertyX/emp {
            proxy_pass http://myfirstgitapp-backend:8080/emp; # keep exact path
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Frontend app with basePath /libertyX
        # Use trailing slash form to avoid duplicating the prefix
        location /libertyX/ {
            proxy_pass http://frontend:3000/; # strip /libertyX when proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optional: root redirect to /libertyX
        location = / {
            return 301 /libertyX/;
        }
    }
}