user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Logging format must be defined BEFORE includes
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name dev2.sophia.com;

        # Proxy /libertyX/api/* to Next.js at /api/* (basePath doesn't apply to API routes)
        location /libertyX/api/ {
            proxy_pass http://frontend.myfirstgitapp.svc.cluster.local:3000/api/;
            # Use forwarded headers from Ingress if available, otherwise use current request values
            proxy_set_header Host $http_x_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        }

        location = /emp {
            proxy_pass http://myfirstgitapp-backend.myfirstgitapp.svc.cluster.local:8080/emp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /libertyX/emp {
            proxy_pass http://myfirstgitapp-backend.myfirstgitapp.svc.cluster.local:8080/emp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /libertyX/ {
            proxy_pass http://frontend.myfirstgitapp.svc.cluster.local:3000/;
            proxy_set_header Host $http_x_forwarded_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        }

        location = / { return 301 /libertyX/; }
    }
}

