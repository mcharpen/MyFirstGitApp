apiVersion: v1
data:
  nginx.conf: "user nginx;\nworker_processes auto;\nerror_log /var/log/nginx/error.log warn;\npid /var/run/nginx.pid;\n\nevents {\n    worker_connections 1024;\n}\n\nhttp {\n    include /etc/nginx/mime.types;\n    default_type application/octet-stream;\n\n    log_format main '$remote_addr - $remote_user [$time_local] \"$request\" '\n                    '$status $body_bytes_sent \"$http_referer\" '\n                    '\"$http_user_agent\" \"$http_x_forwarded_for\"';\n\n    access_log /var/log/nginx/access.log main;\n\n    sendfile on;\n    keepalive_timeout 65;\n\n    server {\n        listen 80;\n        server_name dev2.sophia.com myfirstgitapp.local;\n\n        # Proxy bare /api/* to Next.js app under basePath without redirect\n        location /api/ {\n            proxy_pass http://frontend:3000/libertyX/api/; # replace /api/ with /libertyX/api/\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n        }\n\n        # Keycloak proxy\n        location /libertyX/auth/ {\n            proxy_pass http://keycloak:8080/libertyX/auth/;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n        }\n\n        # Support frontend code calling \"/emp\" (without basePath)\n        location = /emp {\n            proxy_pass http://myfirstgitapp-backend:8080/emp;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n        }\n\n        # Backend API under /libertyX/emp -> upstream /emp\n        location /libertyX/emp {\n            proxy_pass http://myfirstgitapp-backend:8080/emp;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n        }\n        \n        # Frontend app with basePath /libertyX\n        location /libertyX/ {\n            proxy_pass http://frontend:3000/; # strip /libertyX when proxying\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n        }\n\n        # Root redirect to /libertyX\n        location = / { return 301 /libertyX/; }\n    }\n}"
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: nginx
  name: nginx-cm0
